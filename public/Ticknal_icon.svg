<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark tinted brand linear gradient: black is the core dominating color with Cyan → Blue → Magenta tint -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#02141F" />
      <stop offset="35%"  stop-color="#040B1E" />
      <stop offset="70%"  stop-color="#08041A" />
      <stop offset="100%" stop-color="#0E031A" />
    </linearGradient>

    <!-- Top-left Cyan ambient sheen -->
    <radialGradient id="cyanSheen" cx="15%" cy="15%" r="65%">
      <stop offset="0%"   stop-color="#00BCE6" stop-opacity="0.22" />
      <stop offset="60%"  stop-color="#00BCE6" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Center Royal Blue ambient depth -->
    <radialGradient id="centerDepth" cx="50%" cy="45%" r="65%">
      <stop offset="0%"   stop-color="#2962FF" stop-opacity="0.28" />
      <stop offset="50%"  stop-color="#2962FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Bottom-right Magenta ambient sheen -->
    <radialGradient id="magentaSheen" cx="85%" cy="85%" r="65%">
      <stop offset="0%"   stop-color="#D500F9" stop-opacity="0.24" />
      <stop offset="60%"  stop-color="#D500F9" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Solid pitch black base -->
  <rect width="512" height="512" fill="#000000" />

  <!-- Dominating dark gradient tint -->
  <rect width="512" height="512" fill="url(#bgGradient)" />

  <!-- Luminous atmospheric tints -->
  <rect width="512" height="512" fill="url(#cyanSheen)" />
  <rect width="512" height="512" fill="url(#magentaSheen)" />
  <rect width="512" height="512" fill="url(#centerDepth)" />

  <!-- Centered pure white Ticknal logo mark -->
  <g transform="translate(76.0250, 419.3000) scale(0.1150, -0.1150)" fill="#FFFFFF">
    <path d="M1725 2553 c0 -13 -444 -416 -476 -433 -9 -5 -165 -10 -348 -11 l-332 -1 -34 23 c-46 32 -305 376 -305 405 0 12 6 25 13 27 6 3 343 5 747 4 579 -2 735 -5 735 -14z M2898 2558 c7 -7 12 -18 12 -24 0 -7 -67 -100 -150 -207 -109 -142 -159 -198 -182 -208 -25 -10 -101 -14 -318 -14 -255 0 -289 -2 -321 -18 -23 -11 -150 -140 -335 -340 -164 -177 -305 -322 -313 -322 -14 0 -16 31 -19 253 -2 221 0 258 15 289 10 22 98 109 232 232 345 312 377 340 412 356 28 12 113 14 494 15 346 0 464 -3 473 -12z M1818 1221 c3 -662 13 -602 -125 -701 -255 -184 -367 -260 -382 -260 -40 0 -41 7 -41 480 1 332 4 462 13 482 16 37 508 569 521 565 8 -3 12 -174 14 -566z" />
  </g>
</svg>