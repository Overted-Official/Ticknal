[project]
name = "quant-engine"
version = "0.1.0"
description = "XGBoost Signal Engine for QuantEGX"
requires-python = ">=3.10"
dependencies = [
    "xgboost>=2.1.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.12.0",
    "pandas-ta>=0.3.14b",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.36",
    "joblib>=1.4.0",
    "tqdm>=4.66.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
pythonpath = [".."]
testpaths = [
    "tests",
]
