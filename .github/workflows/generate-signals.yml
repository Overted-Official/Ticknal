name: Daily Signal Generation

on:
  schedule:
    # Run at 15:30 UTC every weekday (after EGX market close)
    - cron: '30 15 * * 1-5'
  workflow_dispatch: # Allow manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # In a real environment we'd use requirements.txt or pipenv
          # For now we install from pyproject.toml dependencies manually or via pip
          pip install xgboost pandas numpy scikit-learn pandas-ta psycopg2-binary sqlalchemy joblib tqdm
          
      - name: Run Signal Generation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd quant_engine
          python scripts/generate_signals.py
