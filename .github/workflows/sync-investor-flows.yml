name: Sync EGX Investor Flows & Market Take

on:
  schedule:
    # Runs every 15 minutes between 12:00 UTC and 16:00 UTC (15:00 to 19:00 Cairo time) on Sun-Thu
    - cron: '*/15 12-16 * * 0-4'
  workflow_dispatch:
    inputs:
      inspect_egx:
        description: 'Run EGX DOM inspection'
        type: boolean
        required: false
        default: false

jobs:
  sync-flows:
    name: Sync Flows & Takes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fetch-retries=5 --fetch-retry-mintimeout=20000

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Inspect EGX DOM
        if: ${{ inputs.inspect_egx == true }}
        run: npx tsx scripts/cron/inspect-egx.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Sync EGX Investor Flows (Multi-Source News & Exchange Data)
        if: ${{ inputs.inspect_egx != true }}
        run: npx tsx scripts/cron/sync-investor-flows.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
