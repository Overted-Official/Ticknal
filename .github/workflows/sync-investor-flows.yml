name: Sync EGX Investor Flows & Market Take

on:
  schedule:
    # Runs every 30 minutes between 13:00 UTC and 17:30 UTC (16:00 to 20:30 Cairo time) on Sun-Thu
    - cron: '*/30 13-17 * * 0-4'
  workflow_dispatch:

jobs:
  sync-flows:
    name: Sync Flows & Takes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Sync EGX Investor Flows (Multi-Source News & Exchange Data)
        run: npx tsx scripts/cron/sync-investor-flows.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
