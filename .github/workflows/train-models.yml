name: Weekly Model Retraining

on:
  schedule:
    # Run at 00:00 UTC on Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write # Needed to commit new models back to the repo

jobs:
  train:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install xgboost pandas numpy scikit-learn pandas-ta psycopg2-binary sqlalchemy joblib tqdm
          
      - name: Run Model Training
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd quant_engine
          python scripts/train.py
          
      - name: Commit and Push new models
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add quant_engine/artifacts/*.joblib
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update trained ML models [skip ci]" && git push)
